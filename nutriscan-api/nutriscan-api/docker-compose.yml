services:
  postgres:
    image: postgres:16-alpine
    container_name: nutriscan-postgres
    restart: always
    environment:
      POSTGRES_DB: nutriscandb
      POSTGRES_USER: nutriscan
      POSTGRES_PASSWORD: nutriscan_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: