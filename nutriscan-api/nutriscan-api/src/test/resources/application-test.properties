# Integration tests use a separate database so they never touch dev data.
# Create it once:  docker exec nutriscan-postgres psql -U nutriscan -d nutriscandb -c "CREATE DATABASE nutriscandb_test"
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/nutriscandb_test}
spring.jpa.hibernate.ddl-auto=create-drop

app.seed.enabled=false
app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long

# Point Redis at a closed port so tests exercise the in-memory rate-limit fallback
spring.data.redis.port=6399
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

openrouter.api.key=test-key
