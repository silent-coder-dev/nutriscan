spring.application.name=nutriscan-api

# Server
server.port=${PORT:8080}
# Behind a reverse proxy set this to "native" so the real client IP is used for guest rate limiting
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Security: set JWT_SECRET (min 32 bytes) in every deployed environment.
# Left empty locally, JwtUtil falls back to a development-only secret and logs a warning.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:7d}
# Comma-separated list of web origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Optional demo account (off by default; never resets an existing one)
app.seed.enabled=${SEED_ENABLED:false}
app.seed.email=${SEED_EMAIL:}
app.seed.password=${SEED_PASSWORD:}
app.seed.username=${SEED_USERNAME:demo_scout}
app.seed.full-name=${SEED_FULL_NAME:Demo Scout}

# OpenRouter Configuration (AI fallback is skipped when no key is set)
openrouter.api.key=${OPENROUTER_API_KEY:dummy_key}
openrouter.model=${OPENROUTER_MODEL:apodex/apodex-1.1-mini:free}

# PostgreSQL Configuration
# Production (Render + Neon): set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD as environment variables.
# The fallbacks below are for the LOCAL Docker database only.
# DB_URL / DB_USER / DB_PASSWORD are still accepted as older aliases.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/nutriscandb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:nutriscan}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:nutriscan_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Hibernate can detect the dialect itself; set explicitly as requested (it may log a harmless "not needed" note)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Data is loaded inside service transactions; no lazy loading during JSON rendering
spring.jpa.open-in-view=false

# HikariCP connection pool, tuned for Neon serverless Postgres (works the same locally)
# - Small pool: Render free = 512 MB RAM, and Neon's pooler endpoint multiplexes connections anyway
spring.datasource.hikari.pool-name=NutriScanPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
# - minimum-idle=0 lets the pool drain when idle, so Neon can auto-suspend (saves free compute hours)
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
# - Close idle connections after 2 min; recycle every 10 min, before Neon/PgBouncer drops them
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
# - Waking a suspended Neon compute takes a few seconds, so allow up to 30 s for a connection
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Redis Configuration (guest rate limiting; falls back to in-memory counters if unreachable)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
# /actuator/health/liveness and /readiness (liveness ignores Redis/DB, good for platform health checks)
management.endpoint.health.probes.enabled=true
# Set REDIS_HEALTH_ENABLED=false where no Redis runs, so overall /actuator/health stays UP
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:true}
