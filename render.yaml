# Render Blueprint for NutriScan (https://render.com/docs/blueprint-spec)
#
# Expects ONE GitHub repo whose root contains:
#   nutriscan-api/nutriscan-api/   (Spring Boot API, built with its Dockerfile)
#   nutriscan-web/                 (Next.js frontend)
#
# Database: Neon serverless PostgreSQL (created on neon.tech, not by this Blueprint).
# In Render: New + → Blueprint → pick the repo. Values marked "sync: false" are asked for during setup;
# see nutriscan-web/docs/LEARN.md (Part G) for exactly what to enter.

services:
  # ---------- Backend: Spring Boot API (Docker) ----------
  - type: web
    name: nutriscan-api
    runtime: docker
    plan: free
    # Same AWS region as the Neon database (us-east-2 = Ohio) for low latency
    region: ohio
    dockerfilePath: ./nutriscan-api/nutriscan-api/Dockerfile
    dockerContext: ./nutriscan-api/nutriscan-api
    healthCheckPath: /actuator/health/liveness
    envVars:
      # Neon JDBC URL WITHOUT user/password, e.g.
      # jdbc:postgresql://<endpoint>-pooler.<region>.aws.neon.tech/neondb?sslmode=require&channelBinding=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      # 🔒 Secret: the Neon password (never commit it)
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Random 256-bit secret generated by Render
      - key: JWT_SECRET
        generateValue: true
      # Your frontend URL, e.g. https://nutriscan-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Render sits behind a proxy: use the real client IP for the guest scan limit
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      - key: SEED_ENABLED
        value: "false"
      # No Redis on the free plan: guest limit uses the in-memory fallback
      - key: REDIS_HEALTH_ENABLED
        value: "false"

  # ---------- Frontend: Next.js ----------
  - type: web
    name: nutriscan-web
    runtime: node
    plan: free
    region: ohio
    rootDir: nutriscan-web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Your API URL + /api/v1, e.g. https://nutriscan-api.onrender.com/api/v1 (baked in at build time)
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
